name: Rigs
options:
  bundleIdPrefix: org.monklabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RigKit:
    path: RigKit

targets:
  Rigs:
    type: application
    platform: iOS
    sources:
      - path: Rigs/Sources
      - path: Rigs/Shared
      - path: Rigs/Assets.xcassets
      - path: Rigs/Fonts
        buildPhase: resources
    dependencies:
      - package: RigKit
      - target: RigsWidgets
    info:
      path: Rigs/Info.plist
      properties:
        CFBundleDisplayName: Rigs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Rigs connects to your Switch 2 over Bluetooth to run sessions and show live temperature.
        UIAppFonts: [Geist-UltraLight.ttf, Geist-Light.ttf, Geist-Regular.ttf, Geist-Medium.ttf]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.monklabs.rigsapp
        DEVELOPMENT_TEAM: 733C8U3Q2M
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  RigsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Rigs/Shared
      - path: Rigs/Fonts
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Rigs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Geist-UltraLight.ttf, Geist-Light.ttf, Geist-Regular.ttf, Geist-Medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.monklabs.rigsapp.widgets
        DEVELOPMENT_TEAM: 733C8U3Q2M
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

schemes:
  Rigs:
    build:
      targets:
        Rigs: all
    run:
      config: Debug
      commandLineArguments:
        "-mock": false
    test:
      config: Debug
