name: Rigs
options:
  bundleIdPrefix: org.monklabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RigKit:
    path: RigKit

targets:
  Rigs:
    type: application
    platform: iOS
    sources:
      - path: Rigs/Sources
      - path: Rigs/Assets.xcassets
    dependencies:
      - package: RigKit
    info:
      path: Rigs/Info.plist
      properties:
        CFBundleDisplayName: Rigs
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Rigs connects to your Switch 2 and Peak Pro over Bluetooth to run sessions and show live temperature.
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.monklabs.rigs
        DEVELOPMENT_TEAM: 6S8C5N92KW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Rigs:
    build:
      targets:
        Rigs: all
    run:
      config: Debug
      commandLineArguments:
        "-mock": false
    test:
      config: Debug
